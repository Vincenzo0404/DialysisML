[project]
name = "dialysisml"
version = "0.1.0"
description = "DialysisML is a machine learning project for predicting outcomes in dialysis patients."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "pandas>=3.0.3",
    "pyarrow>=20.0.0",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.51",
    "torch>=2.12.1",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "dtale>=3.22.0",
    "xgboost>=3.4.0",
    "mlflow>=1.27.0",
    "protobuf<5.0.0",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
