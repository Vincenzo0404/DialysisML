# @package _global_

# override keyword is required to override defaults group
defaults:
  - override /window_transformation@postsplit.window_transformation: regression
  - override /presplit: tte_months_sh
  - override /split: single
  - override /postsplit: median

experiment_name: tte_regr_months

model:
  epochs: 70
  learning_rate: 5e-4

# `choice(...)` is only read here and on the CLI; in a plain config value it
# stays a literal string. The swept keys come from ffnn_baseline.yaml and
# config.yaml, so they need no starting value here.
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model.hidden_layers: choice([],[8],[16,8],[32,16,8])
      # ._target_ , not the whole node: overriding `score_metric` itself would
      # replace the dict with a string, and a string is not callable
      model.score_metric._target_: choice(dialysisml.metrics.mape,dialysisml.metrics.mae,dialysisml.metrics.huber)

      
