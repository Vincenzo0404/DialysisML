# The adapter takes its hyperparameters directly: a sweep overrides
# `adapter.max_depth`, not `adapter.model_config.max_depth`.
_target_: dialysisml.adapters.XGBoostAdapter

n_estimators: 300
max_depth: 4
learning_rate: 0.05
subsample: 0.8
colsample_bytree: 0.8
reg_lambda: 1.0
min_child_weight: 50.0
early_stopping_rounds: 30
random_seed: ${seed}

# One binary problem per bucket. `scale_pos_weight` stays out on purpose: the
# hazards multiply into a survival curve, and reweighting the classes shifts
# every one of them away from the probability it is supposed to be.
objective: binary:logistic
eval_metric: logloss
