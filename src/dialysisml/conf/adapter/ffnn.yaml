# The adapter takes its hyperparameters directly: a sweep overrides
# `model.dropout`, not `model.model_config.dropout`.
_target_: dialysisml.adapters.FFNNAdapter

hidden_layers: []
dropout: 0.4
learning_rate: 1e-3
weight_decay: 1e-4
batch_size: 32
epochs: 60
random_seed: ${seed}

# _partial_ is required: without it Hydra would call the loss instead of
# passing it, and the adapter would receive its return value.
loss_function:
  _target_: dialysisml.metrics.mape
  _partial_: true
