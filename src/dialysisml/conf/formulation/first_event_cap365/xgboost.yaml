# @package _global_
# Whether this formulation's poor showing was the target or the loss.
#
# The FFNN reached val MAE 4.67 against 2.64 for a constant 13, under a MAPE
# loss whose `1/y` weights pull every prediction down. Boosted trees on the
# same windows, under objectives that are relative by construction, separate
# the two explanations: if the target carries the signal, one of these clears
# the constant on the percentage error; if none does, the target is the
# problem and no loss rescues it.
#
# Shallow with a floor on leaf size, for the reason the bucket sweep is: the
# effective sample is ~1200 train patients, not the ~140k windows their
# sessions produce.
defaults:
  # the folder is spelled out because a relative default resolves against the
  # config group, `formulation`, not against this directory
  - first_event_cap365/_base
  - override /adapter: xgb_regressor
  - _self_

# Two relative-error objectives, neither of them a hand-rolled MAPE -- that
# would carry a zero hessian, which leaves xgboost's leaf formula with nothing
# to scale by:
#   - `squaredlogerror` works in log space, where a difference *is* a relative
#     error, and compresses MAPE's weighting from `1/y` to about `1/(y+1)`
#   - `gamma` predicts through a log link, so it cannot return a negative time,
#     and its deviance depends on `y/pred` alone
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      adapter.objective: choice(reg:squaredlogerror, reg:gamma)
      adapter.max_depth: choice(15,20)
      adapter.reg_lambda: choice(1.0, 10.0)
      adapter.min_child_weight: choice(20.0, 50.0)
