# Defines the sequence of transformations to be applied to the splits.
# Every entry is fitted on the training rows and applied to both sides.
# Order matters: clipping before imputing keeps the medians inside the bounds.
fitted_transformations:
  # No columns listed: every numeric column, so a new feature is covered too.
  - _target_: dialysisml.pipeline.steps.apply_sklearn_transformer
    _partial_: true
    transformer:
      _target_: dialysisml.preprocessing.Winsorizer
      lower: 0.01
      upper: 0.99

  - _target_: dialysisml.pipeline.steps.apply_sklearn_transformer
    _partial_: true
    transformer:
      _target_: sklearn.impute.SimpleImputer
      strategy: median


  
