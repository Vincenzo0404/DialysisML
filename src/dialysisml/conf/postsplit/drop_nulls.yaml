# Defines the sequence of transformations to be applied to the splits.
# No imputer: rows still missing a feature after sample-and-hold (a feature
# never measured for that patient) are dropped instead of filled.
fitted_transformations:
  - _target_: dialysisml.pipeline.steps.drop_incomplete_rows
    _partial_: true

  # No columns listed: every numeric column, so a new feature is covered too.
  - _target_: dialysisml.pipeline.steps.apply_sklearn_transformer
    _partial_: true
    transformer:
      _target_: dialysisml.preprocessing.Winsorizer
      lower: 0.01
      upper: 0.99

