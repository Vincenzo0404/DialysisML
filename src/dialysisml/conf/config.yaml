defaults:
  - base_config
  - presplit: tte_sh
  - split: single
  - postsplit: median
  # its own group, so the transformer and the window size vary independently
  - window_transformation@postsplit.window_transformation: regression
  - model: ffnn_baseline
  - _self_

# Read from the database instead of the cached parquet files.
fromdb: false

seed: 42

# Which metrics to report for each epoch
metrics:
  - {_target_: dialysisml.metrics.mae, _partial_: true}
  - {_target_: dialysisml.metrics.mape, _partial_: true}


window_conf:
  size: 30