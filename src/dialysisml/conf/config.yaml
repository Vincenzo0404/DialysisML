defaults:
  - base_config
  - split: single
  - postsplit: median
  # its own group, so the transformer and the window size vary independently
  - window_transformation@postsplit.window_transformation: regression
  - adapter: ffnn
  # before the formulation, not last: a formulation has to win over the
  # defaults set here
  - _self_
  # `???`, no default: the presplit lives inside a formulation, so composing
  # without one leaves the pipeline empty and the run dies much further down
  - formulation: ???

# Read from the database instead of the cached parquet files.
fromdb: false

seed: 42

# Which metrics to report for each epoch
metrics:
  - {_target_: dialysisml.metrics.mae, _partial_: true}
  - {_target_: dialysisml.metrics.mape, _partial_: true}


window_conf:
  size: 30
